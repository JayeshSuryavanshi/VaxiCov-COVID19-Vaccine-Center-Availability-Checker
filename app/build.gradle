plugins {
    id 'com.android.application'
}

// The registry base URL lives in local.properties (git-ignored) so that
// nothing private is committed. See README.md -> "Configuration".
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

static String quoted(String value) {
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        // The Play Store identity of the 1.0 release; must never change.
        // Source code lives under the neutral com.vaxicov namespace instead.
        applicationId "com.akshaychavan.vaxicov"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 4
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Public CoWIN API (https://apisetu.gov.in/public/marketplace/api/cowin)
        buildConfigField "String", "COWIN_BASE_URL",
                quoted(localProperties.getProperty('vaxicov.cowinBaseUrl', 'https://cdn-api.co-vin.in/api/v2/'))
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
    }
}


dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.work:work-runtime:2.6.0'
    implementation 'com.google.android.material:material:1.4.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.8'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
